version: '3.8'

services:
  mysql:
    image: mysql:8.4.2
    container_name: dating_chat_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-dating_chat_db}
      MYSQL_USER: ${DB_USERNAME:-chat_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_for_local_development}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_chat_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=300
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dating_chat_network

volumes:
  mysql_chat_data:
    driver: local

networks:
  dating_chat_network:
    driver: bridge
