spring:
  application:
    name: chat-service
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
    default-property-inclusion: non_null

server:
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# Springdoc OpenAPI Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    enabled: true

# Chat Application Business Configurations
chat:
  jwt:
    secret: ${JWT_SECRET:test-only-secret-key-change-before-production-0123456789abcdef}
    issuer: ${JWT_ISSUER:dating-app-auth-service}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  message:
    max-length: 2000
    default-page-size: 30
    max-page-size: 100
  icebreaker:
    history-lookback: ${ICEBREAKER_HISTORY_LOOKBACK:80}
    default-suggestions: ${ICEBREAKER_DEFAULT_SUGGESTIONS:4}
    max-suggestions: ${ICEBREAKER_MAX_SUGGESTIONS:6}
    quiet-after-hours: ${ICEBREAKER_QUIET_AFTER_HOURS:6}
  ai-assistant:
    enabled: ${AI_ASSISTANT_ENABLED:true}
    api-key: ${AI_ASSISTANT_API_KEY:${GROQ_API_KEY:${OPENAI_API_KEY:${AI_GATEWAY_API_KEY:${VERCEL_OIDC_TOKEN:}}}}}
    base-url: ${AI_ASSISTANT_BASE_URL:https://api.groq.com/openai/v1}
    model: ${AI_ASSISTANT_MODEL:llama-3.3-70b-versatile}
    timeout-seconds: ${AI_ASSISTANT_TIMEOUT_SECONDS:30}
    history-messages: ${AI_ASSISTANT_HISTORY_MESSAGES:40}
    max-suggestions: ${AI_ASSISTANT_MAX_SUGGESTIONS:12}
    max-output-tokens: ${AI_ASSISTANT_MAX_OUTPUT_TOKENS:1800}
